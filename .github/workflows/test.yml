name: PDF Annotator Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask PyMuPDF
        pip install pytest pytest-cov selenium webdriver-manager

    - name: Create test PDF
      run: |
        mkdir -p tests/test_files
        python tests/create_sample_pdf.py

    - name: Run API tests
      run: |
        pytest tests/test_api.py --cov=app -v

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Start Flask server
      run: |
        python app.py &
        sleep 5  # サーバー起動を待つ
      env:
        FLASK_ENV: testing

    - name: Run E2E tests (if server is ready)
      run: |
        if curl -s http://localhost:5000 > /dev/null; then
          pytest tests/test_e2e.py -v || echo "E2E tests failed but continuing"
        else
          echo "サーバーが起動していないため、E2Eテストをスキップします"
        fi
